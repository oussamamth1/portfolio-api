services:
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: NODE_VERSION
        value: 22

  # Face Check API (Python/Docker) - see face-check/README.md
  - type: web
    name: face-check-api
    runtime: docker
    dockerContext: ./face-check
    dockerfilePath: ./face-check/Dockerfile
    plan: standard          # 2 GB RAM - the face model needs more than the 512 MB starter plan
    region: frankfurt
    healthCheckPath: /health
    buildFilter:
      paths:
        - face-check/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: face-check-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: OFFICER_API_KEY
        generateValue: true
      - key: MATCH_THRESHOLD
        value: "0.45"
      - key: TOP_K
        value: "3"

databases:
  - name: face-check-db
    plan: basic-256mb
    region: frankfurt
    ipAllowList: []         # no public access - only Render services can connect
